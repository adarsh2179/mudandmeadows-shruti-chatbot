version: "3.8"

services:
  concierge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mudandmeadows-concierge
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - SESSION_DB_PATH=/app/data/concierge_state.db
    volumes:
      - concierge_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  concierge_data:
